services:
    development:
        environment:
            - TZ=Europe/Zurich
            - WATTPILOT_SETTINGS=/data/config.ini.settings
            - WATTPILOT_DB=/data/wattpilot.db
        build:
            context: .
            dockerfile: docker/development.Dockerfile
        volumes:
            - wattpilot-data:/data
        ports:
            - 8088:8080

volumes:
    wattpilot-data:
