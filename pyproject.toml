[project]
name = "wattpilot"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.15"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "nicegui>=3.0",
    "pykka>=4.5.0",
    "rpi-lgpio>=0.6",
    "sqlalchemy>=2.0",
    "transitions>=0.9.3",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.1",
    "ty>=0.0.89",
    "types-rpi-gpio>=0.7.0.20260508",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["wattpilot"]

[tool.setuptools.packages.find]
where = ["."]
include = ["wattpilot*", "frontend*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py315"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
  "C4",  # comprehensions
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "RUF", # ruff specific
  "T20", # print
  "UP",  # pyupgrade
  "W",   # pydocstyle warning
  "NPY", # numpy
  "PT",  # pytest
  "RSE", # flake8-raise
  "DTZ", # flake8-datetime
]
